<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふかげーむ - 戦闘</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091126;color:#202a3b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(760px,100%);margin:auto;min-height:100vh;background:linear-gradient(#101b39 0 170px,#eef2f7 170px);padding:12px 12px 34px}.top{color:#fff;padding:6px 4px 12px}.top h1{font-size:21px;margin:0}.top p{font-size:12px;color:#c5d0e8;margin:5px 0 0}.card{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 5px 18px #07112b12}.fighters{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;text-align:center;gap:8px}.fighter{background:#f1f4f9;border-radius:12px;padding:16px 8px;font-weight:900}.vs{color:#7c89a0;font-weight:900}.enemy{background:#eef1f8;border-radius:12px;padding:16px 8px;font-weight:900}.section-head{display:flex;justify-content:space-between;align-items:center}.section-head h2{font-size:16px;margin:0}.pill{font-size:10px;border:1px solid #d8dfeb;border-radius:99px;padding:5px 8px;color:#5e6d88}.tools{display:flex;gap:7px;position:sticky;top:8px;z-index:5;justify-content:flex-end;margin:8px 0}.tool{border:1px solid #cfd8e6;background:#fff;color:#4d607f;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:900;box-shadow:0 2px 8px #0002}.tool.primary{background:#253f7b;color:#fff;border-color:#253f7b}.log{font-size:12px;line-height:1.5}.turn{font-size:10px;color:#8792a4;letter-spacing:.5px;margin:8px 0 3px}.line{padding:2px 0}.result{margin-top:7px;padding:7px 9px;background:#f4f6fa;border-radius:8px;font-size:12px}.drop{font-size:11px;color:#63728b}.compact .turn,.compact .line{display:none}.compact .result,.compact .drop{display:block}.reward{margin-top:12px;padding:12px;background:#f3f5fa;border-radius:11px;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.row button{border:0;border-radius:10px;padding:11px;font-weight:900;background:#294786;color:#fff}.row .back{background:#fff;color:#4f607d;border:1px solid #d7dfeb}.float{position:fixed;right:16px;bottom:18px;z-index:20;border:0;border-radius:99px;background:#253f7b;color:#fff;padding:11px 15px;font-size:12px;font-weight:900;box-shadow:0 4px 12px #0004;display:none}.float.show{display:block}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>戦闘</h1><p>はじまりの草原 / 星明かりの戦場</p></header>
<div class="card"><div class="fighters"><div class="fighter">冒険者</div><div class="vs">VS</div><div class="enemy" id="enemyName">敵</div></div></div>
<div class="card">
  <div class="section-head"><h2>戦闘ログ</h2><span class="pill" id="countLabel">×1</span></div>
  <div class="tools"><button class="tool primary" id="jump">↓ ログ末尾へ</button><button class="tool" id="toggle">詳細ログをたたむ</button></div>
  <div class="log" id="log"></div>
  <div class="reward hidden" id="reward"></div>
</div>
<div class="row"><button id="again">もう一度探索</button><button class="back" id="home">ホームへ戻る</button></div>
</div>
<button class="float" id="float">↓ 最新</button>
<script>
const KEY="fukagame_v8";
const enemies=[["くさねずみ","ねずみの毛",10],["つのうさぎ","硬いつの",8],["ころころスライム","粘液",7],["いたずらコボルト","獣人の爪",14],["森のまじゅつ師","魔法の枝",13],["おおきなキノコ","キノコの胞子",9]];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
let state=load(),count=Math.max(1,Math.min(10,state.pending||1));
document.getElementById("countLabel").textContent="×"+count;
const log=document.getElementById("log"),jump=document.getElementById("jump"),toggle=document.getElementById("toggle"),float=document.getElementById("float");
function add(html,cls="line"){const d=document.createElement("div");d.className=cls;d.innerHTML=html;log.appendChild(d)}
function run(){
 let exp=0,gold=0,mats=0;
 for(let i=0;i<count;i++){
   const e=enemies[Math.floor(Math.random()*enemies.length)];
   document.getElementById("enemyName").textContent=e[0];
   let hp=28,turn=1;
   while(hp>0&&turn<=12){
     const dmg=10+(state.lv||1)*2+Math.floor(Math.random()*5);hp-=dmg;
     const d=document.createElement("div");d.innerHTML='<div class="turn">―― ターン '+turn+' ――</div><div class="line">冒険者の攻撃！ <b>'+dmg+'</b> ダメージ</div>'+(hp>0?'<div class="line">'+e[0]+'の攻撃！ 冒険者に <b>'+Math.max(1,e[2]-5)+'</b> ダメージ</div>':"");log.appendChild(d);turn++;
   }
   const mat=1+Math.floor(Math.random()*2);mats+=mat;exp+=10;gold+=5;state.kills=(state.kills??0)+1;add("冒険者は「"+e[0]+"」を倒した！","result");add("素材獲得　"+e[1]+" ×"+mat,"drop");
 }
 state.sta=Math.max(0,(state.sta??500)-count);state.exp=(state.exp??0)+exp;state.gold=(state.gold??100)+gold;
 while(state.exp>=state.lv*20){state.exp-=state.lv*20;state.lv++;(state.notices??=[]).push({t:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),m:"Lv"+state.lv+"になった！"})}
 (state.notices??=[]).push({t:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),m:"探索×"+count+"完了：EXP +"+exp+" / G +"+gold+" / 素材 +"+mats});
 state.pending=0;localStorage.setItem(KEY,JSON.stringify(state));
 document.getElementById("reward").innerHTML="<b>探索×"+count+" 完了</b><br>EXP +"+exp+" / G +"+gold+" / 素材 +"+mats+"個";
 document.getElementById("reward").classList.remove("hidden");
 if(count>=10){log.classList.add("compact");toggle.textContent="詳細ログをひらく"}
 window.scrollTo({top:0,behavior:"instant"});updateFloat();
}
function bottom(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"})}
function updateFloat(){const near=innerHeight+scrollY>=document.documentElement.scrollHeight-180;float.classList.toggle("show",!near)}
jump.onclick=bottom;float.onclick=bottom;addEventListener("scroll",updateFloat,{passive:true});
toggle.onclick=()=>{log.classList.toggle("compact");toggle.textContent=log.classList.contains("compact")?"詳細ログをひらく":"詳細ログをたたむ"};
document.getElementById("home").onclick=()=>location.href="index.html";
document.getElementById("again").onclick=()=>location.href="index.html#explore";
run();
</script>
</body>
</html>
